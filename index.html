<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cari Lokasi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <h3>Nama : Muhamad Rafli Pratama</h3>
    <h3>Nim : 20240140003</h3>
    <hr>

    Lokasi : <input type="text" id="inputLokasi" value="Jakarta">
    <button id="btnCari">Cari</button>

    <br><br>

    negara : <p id="negara"></p>
    provinsi : <p id="provinsi"></p>
    kecamatan : <p id="kecamatan"></p>
    longitude : <p id="longitude"></p>
    latitude : <p id="latitude"></p>

     <script>
        function ambilData() {
            const kota = $("#inputLokasi").val();
            const urlapi = "https://api.maptiler.com/geocoding/" + kota + ".json?key=Eq0rtMU0SPHv3YUxlhGe";

            $.ajax({
                url: urlapi,
                method: "GET",
                dataType: "json",
                success: function(data) {
                    console.log(data);

                    const feature = data.features[0];

                    
                    let long = feature.geometry.coordinates[0];
                    let lat = feature.geometry.coordinates[1];

                    
                    let negara = feature.context[1] ? feature.context[1].text : "-";
                    let provinsi = feature.context[0] ? feature.context[0].text : "-";
                    let kecamatan = feature.text ? feature.text : "-";

                    
                    $("#negara").html(negara);
                    $("#provinsi").html(provinsi);
                    $("#kecamatan").html(kecamatan);
                    $("#longitude").html(long);
                    $("#latitude").html(lat);
                },
                error: function(error) {
                    console.log(error);
                }
            });
        }

        
        $("#btnCari").click(function() {
            ambilData();
        });

        
        ambilData();
    </script>
</body>
</html>
